spring:
  application:
    name: interview-copilot_edge-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # iss is validated against the public issuer; keys are fetched over the internal URL.
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/interview-copilot}
          jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8081/realms/interview-copilot/protocol/openid-connect/certs}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: bff-api
              uri: ${BFF_URL:http://localhost:8082}
              predicates:
                - Path=/api/**

edge:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:600}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8080}
